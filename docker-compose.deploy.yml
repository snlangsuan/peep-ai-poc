services:
  api:
    image: ghcr.io/snlangsuan/peep-ai-api:latest
    container_name: peep-ai-api
    restart: always
    env_file:
      - .env.dev
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: peep-ai-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
