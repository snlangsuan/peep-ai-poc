name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - prod
      reason:
        description: 'Reason for deployment'
        required: false
        type: string

run-name: Deploy to ${{ inputs.deploy_target }} by @${{ github.actor }} - ${{ inputs.reason }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: peep-ai-poc

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create env file from secrets
        shell: bash
        env:
          GOOGLE_AUTH_PRIVATE_KEY: ${{ secrets.GOOGLE_AUTH_PRIVATE_KEY }}
        run: |
          echo "NODE_ENV=${{ secrets.NODE_ENV || 'development' }}" > .env
          echo "HOST=${{ secrets.HOST || '0.0.0.0' }}" >> .env
          echo "PORT=${{ secrets.PORT || '8000' }}" >> .env
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
          echo "WHITE_LIST_ORIGINS=${{ secrets.WHITE_LIST_ORIGINS }}" >> .env
          echo "GOOGLE_GENAI_API_KEY=${{ secrets.GOOGLE_GENAI_API_KEY }}" >> .env
          echo "GOOGLE_PROJECT_ID=${{ secrets.GOOGLE_PROJECT_ID }}" >> .env
          echo "GOOGLE_LOCATION=${{ secrets.GOOGLE_LOCATION || 'us-central1' }}" >> .env
          echo "GOOGLE_AUTH_CLIENT_EMAIL=${{ secrets.GOOGLE_AUTH_CLIENT_EMAIL }}" >> .env
          echo "GOOGLE_AUTH_PRIVATE_KEY=\"$GOOGLE_AUTH_PRIVATE_KEY\"" >> .env
          echo "GOOGLE_GEMINI_CHAT_MODEL=${{ secrets.GOOGLE_GEMINI_CHAT_MODEL || 'gemini-3.1-flash-lite' }}" >> .env
          echo "GOOGLE_GEMINI_EXTRACT_MODEL=${{ secrets.GOOGLE_GEMINI_EXTRACT_MODEL || 'gemini-2.5-flash-lite' }}" >> .env
          echo "FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/dev.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # We lowercase the image name for compatibility
            IMAGE_PATH=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
            
            sudo -u ${{ secrets.TARGET_USER }} bash -c "
              echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              
              echo \"Pulling Docker image from GHCR: $IMAGE_PATH\"
              docker pull $IMAGE_PATH:latest
              
              echo 'Stopping and removing existing container...'
              docker stop ${{ env.CONTAINER_NAME }} || true
              docker rm ${{ env.CONTAINER_NAME }} || true
              
              echo 'Starting new container...'
              docker run -d \
                --name "${CONTAINER_NAME}" \
                --restart always \
                --add-host=host.docker.internal:host-gateway \
                -p 8500:8000 \
                --health-cmd="curl -f http://localhost:8000/health || exit 1" \
                --health-interval=30s \
                --health-timeout=10s \
                --health-retries=3 \
                $IMAGE_PATH:latest
            "
